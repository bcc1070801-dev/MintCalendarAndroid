<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>薄荷奶油行事曆</title>

<style>
:root{
  --mint:#8fcfba;
  --dark:#559f89;
  --soft:#dff3ea;
  --cream:#fffaf0;
  --ink:#40564e;
  --muted:#789087;
  --line:#c9ded5;
  --rose:#f4d9dc;
  --sky:#dbeaf4;
  --sun:#f6e9b9;
  --lav:#e8def1;
}
*{box-sizing:border-box}

body{
  margin:0;
  padding:14px 12px 35px;
  background:var(--cream);
  color:var(--ink);
  font-family:system-ui,-apple-system,sans-serif;
}

.card{
  background:#fffdf8;
  border:1px solid var(--line);
  border-radius:24px;
  padding:15px;
  margin-bottom:12px;
}

.soft{
  background:var(--soft);
  border-radius:18px;
  padding:13px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.title{
  font-size:21px;
  font-weight:800;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.stat{
  text-align:center;
  background:var(--soft);
  padding:10px;
  border-radius:16px;
}

.stat b{
  font-size:22px;
}

.tabs,.chips,.moods{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.tabs{
  margin-bottom:12px;
}

.btn{
  border:1px solid var(--line);
  background:#fffdf8;
  color:var(--ink);
  border-radius:999px;
  padding:9px 12px;
  font-weight:650;
}

.btn.on,.primary{
  background:var(--dark);
  color:white;
  border-color:var(--dark);
}

.monthbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.round{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid var(--line);
  background:#fffdf8;
  font-size:22px;
  color:var(--dark);
}

.weekhead,.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}

.weekhead div{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  padding-bottom:4px;
}

.day{
  min-height:70px;
  border:1px solid var(--line);
  background:#fffdf8;
  border-radius:13px;
  padding:5px;
  overflow:hidden;
}

.day.active{
  border:2px solid var(--dark);
  background:var(--soft);
}

.num{
  font-size:12px;
  font-weight:800;
}

.dot{
  font-size:9px;
  padding:2px 3px;
  border-radius:7px;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.work{background:var(--sky)}
.family{background:var(--sun)}
.date{background:var(--lav)}
.important{background:var(--rose)}
.self{background:var(--soft)}

.chip{
  font-size:12px;
  padding:5px 8px;
  border-radius:999px;
}

.event{
  border:1px solid var(--line);
  border-radius:17px;
  padding:11px;
  margin-top:8px;
}

.done{
  opacity:.55;
  text-decoration:line-through;
}

.mood.selected{
  outline:2px solid var(--dark);
}

label{
  display:block;
  font-size:13px;
  margin-top:10px;
}

input,select{
  width:100%;
  min-height:44px;
  margin-top:4px;
  border:1px solid var(--line);
  border-radius:14px;
  padding:9px;
  background:#fffdf8;
  font-size:15px;
  color:var(--ink);
}

.hidden{
  display:none;
}

/* 新增／修改行程：跳出視窗 */
#formModal{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;padding:18px}
#formModal.hidden{display:none}
#formModal #formCard{display:block;width:min(100%,520px);max-height:88vh;overflow-y:auto;margin:0;box-sizing:border-box}
body.modal-open{overflow:hidden}

</style>
</head>

<body>

<div class="card">
  <div class="soft row">
    <div>
      <div class="small">🍃 TODAY</div>
      <div class="title">今天也慢慢完成就好 ♡</div>
      <div class="small">☁️ 輕鬆安排 · 不把生活塞太滿</div>
    </div>
    <div style="font-size:36px">🌿</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="small">今日行程</div>
      <b id="count">0</b>
    </div>

    <div class="stat">
      <div class="small">已完成</div>
      <b id="doneCount">0</b>
    </div>
  </div>
</div>

<div class="card">

  <div class="tabs">
    <button class="btn on tab" data-tab="month">🗓 月曆</button>
    <button class="btn tab" data-tab="week">📖 本週</button>
    <button class="btn tab" data-tab="goal">🎯 月目標</button>
  </div>

  <div id="monthView">

    <div class="monthbar">
      <button id="prev" class="round">‹</button>

      <div style="text-align:center">
        <div class="small">MY LITTLE CALENDAR</div>
        <div id="monthTitle" class="title"></div>
      </div>

      <button id="next" class="round">›</button>
    </div>

    <div class="weekhead">
      <div>日</div>
      <div>一</div>
      <div>二</div>
      <div>三</div>
      <div>四</div>
      <div>五</div>
      <div>六</div>
    </div>

    <div id="calendar" class="calendar"></div>
  </div>

  <div id="weekView" class="hidden"></div>

  <div id="goalView" class="hidden">
    <b>🎯 這個月想完成的事</b>

    <div class="row" style="margin-top:8px">
      <input id="goalInput" placeholder="例如：整理房間" style="margin:0">
      <button id="addGoal" class="btn primary">＋</button>
    </div>

    <div id="goals"></div>
  </div>
</div>

<div class="card">

  <div class="row">
    <div>
      <div class="small">✨ SELECTED DAY</div>
      <b id="dateLabel"></b>
    </div>

    <button id="showForm" class="btn primary" type="button">＋ 新增行程</button>
  </div>

  <div class="chips" style="margin:10px 0">
    <span class="chip work">💼 工作</span>
    <span class="chip family">🏡 家庭</span>
    <span class="chip date">☕ 約會</span>
    <span class="chip important">⭐ 重要</span>
    <span class="chip self">🌿 自己</span>
  </div>

  <div class="soft">
    <b>😊 今天心情</b>

    <div class="moods" style="margin-top:8px">
      <button class="btn mood">😊</button>
      <button class="btn mood">🥰</button>
      <button class="btn mood">😴</button>
      <button class="btn mood">😤</button>
      <button class="btn mood">🥲</button>
    </div>
  </div>

  <div id="events"></div>
</div>

<div id="formModal" class="hidden">
<div id="formCard" class="card">

  <b id="formTitle">🧸 新增可愛行程</b>

  <label>
    📅 日期
    <input id="eventDate" type="date">
  </label>

  <label style="display:flex;align-items:center;gap:8px;margin-top:12px">
    <input id="allDay" type="checkbox" style="width:auto;margin:0">
    🌞 整天行程
  </label>

  <label>
    ⏰ 時間（24 小時制）

    <select id="time">
      <option value="">請選擇時間</option>
      <option value="00:00">00:00</option>
      <option value="01:00">01:00</option>
      <option value="02:00">02:00</option>
      <option value="03:00">03:00</option>
      <option value="04:00">04:00</option>
      <option value="05:00">05:00</option>
      <option value="06:00">06:00</option>
      <option value="07:00">07:00</option>
      <option value="08:00">08:00</option>
      <option value="09:00">09:00</option>
      <option value="10:00">10:00</option>
      <option value="11:00">11:00</option>
      <option value="12:00">12:00</option>
      <option value="13:00">13:00</option>
      <option value="14:00">14:00</option>
      <option value="15:00">15:00</option>
      <option value="16:00">16:00</option>
      <option value="17:00">17:00</option>
      <option value="18:00">18:00</option>
      <option value="19:00">19:00</option>
      <option value="20:00">20:00</option>
      <option value="21:00">21:00</option>
      <option value="22:00">22:00</option>
      <option value="23:00">23:00</option>
    </select>
  </label>

  <label>
    ✏️ 行程名稱
    <input id="name" placeholder="今天要做什麼？">
  </label>

  <label>
    🏷️ 分類

    <select id="type">
      <option>工作</option>
      <option>家庭</option>
      <option>約會</option>
      <option>重要</option>
      <option>自己</option>
    </select>
  </label>

  <label>
    🔁 重複

    <select id="repeat">
      <option value="none">不重複</option>
      <option value="weekly">每週固定</option>
    </select>
  </label>

  <label>
    🔔 提醒

    <select id="reminder">
      <option value="-1">不提醒</option>
      <option value="0">準時</option>
      <option value="10">10 分鐘前</option>
      <option value="30">30 分鐘前</option>
      <option value="60">1 小時前</option>
      <option value="1440">1 天前</option>
    </select>
  </label>

  <label>
    📝 備註
    <input id="note" placeholder="可以留一句提醒">
  </label>

  <div style="display:flex;gap:8px;margin-top:12px">
    <button id="save" class="btn primary">儲存 ♡</button>
    <button id="cancel" class="btn" type="button">取消</button>
  </div>

</div>
</div>

<script>

const icons={
  工作:'💼',
  家庭:'🏡',
  約會:'☕',
  重要:'⭐',
  自己:'🌿'
};

const cls={
  工作:'work',
  家庭:'family',
  約會:'date',
  重要:'important',
  自己:'self'
};

const today=new Date();

const pad=n=>String(n).padStart(2,'0');

const keyFrom=(y,m,d)=>
`${y}-${pad(m+1)}-${pad(d)}`;

let sel=keyFrom(
  today.getFullYear(),
  today.getMonth(),
  today.getDate()
);

let view={
  y:today.getFullYear(),
  m:today.getMonth()
};

let editingEvent=null;
let editingDate=null;

let data=JSON.parse(
  localStorage.getItem('mintCalendarData')
  ||
  '{"events":{},"moods":{},"goals":[]}'
);

const $=id=>document.getElementById(id);

function persist(){
  const payload=JSON.stringify(data);
  const updatedAt=new Date().toISOString();

  localStorage.setItem(
    'mintCalendarData',
    payload
  );
  localStorage.setItem(
    'mintCalendarUpdatedAt',
    updatedAt
  );

  // Firebase 尚未連線時也不影響 App 原本功能。
  if(typeof window.cloudSync==='function'){
    try{ window.cloudSync(payload,updatedAt); }catch(_){ }
  }
}

// 提供 Firebase 模組安全套用雲端資料，不直接攔截 localStorage。
window.applyMintCalendarCloudData=function(payload,updatedAt){
  try{
    const parsed=JSON.parse(payload);
    if(!parsed || typeof parsed!=='object') return false;

    data=parsed;
    localStorage.setItem('mintCalendarData',payload);
    if(updatedAt){
      localStorage.setItem('mintCalendarUpdatedAt',updatedAt);
    }
    renderAll();
    return true;
  }catch(err){
    console.error('套用雲端資料失敗',err);
    return false;
  }
};

function label(k){
  let[y,m,d]=k.split('-');
  return`${y}年 ${+m}月 ${+d}日`;
}

/* 強制轉成 24 小時格式 */
function time24(v){

  let m=String(v||'').match(
    /^(\d{1,2}):(\d{2})$/
  );

  if(!m){
    return String(v||'');
  }

  let hour=Math.max(
    0,
    Math.min(23,+m[1])
  );

  return pad(hour)+':'+m[2];
}

function stats(){

  let a=data.events[sel]||[];

  $('count').textContent=a.length;

  $('doneCount').textContent=
  a.filter(x=>x.done).length;
}

function renderCalendar(){

  let box=$('calendar');

  box.innerHTML='';

  $('monthTitle').textContent=
  `${view.y}年 ${view.m+1}月`;

  let first=
  new Date(view.y,view.m,1).getDay();

  let days=
  new Date(view.y,view.m+1,0).getDate();

  for(let i=0;i<first;i++){
    box.appendChild(
      document.createElement('div')
    );
  }

  for(let d=1;d<=days;d++){

    let k=keyFrom(
      view.y,
      view.m,
      d
    );

    let b=
    document.createElement('button');

    b.className=
    'day'+
    (k===sel?' active':'');

    let n=
    document.createElement('div');

    n.className='num';

    n.textContent=
    d+
    (data.moods[k]
      ?' '+data.moods[k]
      :''
    );

    b.appendChild(n);

    (data.events[k]||[])
    .slice(0,2)
    .forEach(e=>{

      let x=
      document.createElement('div');

      x.className=
      'dot '+cls[e.type];

      x.textContent=
      `${icons[e.type]} ${e.name}`;

      b.appendChild(x);

    });

    b.onclick=()=>{
      sel=k;
      renderAll();
    };

    box.appendChild(b);
  }
}

function renderEvents(){

  $('dateLabel').textContent=
  label(sel);

  let box=$('events');

  box.innerHTML='';

  let arr=
  (data.events[sel]||[])
  .slice()
  .sort((a,b)=>{
    if(!!a.allDay !== !!b.allDay) return a.allDay ? -1 : 1;
    return String(a.time||'').localeCompare(String(b.time||''));
  });

  if(!arr.length){

    box.innerHTML=
    '<div class="small" style="text-align:center;padding:20px">今天還沒有安排 🍃</div>';
  }

  arr.forEach(e=>{

    let c=
    document.createElement('div');

    c.className=
    'event '+cls[e.type];

    let rt='';

    if(+e.reminder>=0){

      rt=
      +e.reminder===0
      ?'準時'
      :
      +e.reminder===60
      ?'1小時前'
      :
      +e.reminder===1440
      ?'1天前'
      :
      e.reminder+'分鐘前';
    }

    c.innerHTML=`
    <div class="row">

      <div>

        <div
        class="${e.done?'done':''}"
        style="font-weight:800">

        ${icons[e.type]}
        ${e.allDay ? '整天' : time24(e.time)}
        　
        ${e.name}

        </div>

        <div class="small"
        style="margin-top:5px">

        ${e.type}
        ${e.repeat==='weekly'
          ?' · 每週固定'
          :''
        }
        ${rt
          ?' · 🔔 '+rt
          :''
        }

        </div>

        ${
          e.note
          ?
          `<div style="font-size:13px;margin-top:5px">${e.note}</div>`
          :
          ''
        }

      </div>

      <div style="display:flex;gap:5px;flex-direction:column">

        <button class="btn finish">
        ${e.done?'↩':'✓'}
        </button>

        <button class="btn edit">
        修改
        </button>

        <button class="btn delete">
        刪除
        </button>

      </div>

    </div>
    `;

    c.querySelector('.finish').onclick=()=>{

      e.done=!e.done;

      persist();

      renderAll();
    };

    c.querySelector('.edit').onclick=()=>{

      editingEvent=e;
      editingDate=sel;

      $('formTitle').textContent='✏️ 修改行程';
      $('eventDate').value=sel;
      $('allDay').checked=!!e.allDay;
      $('time').value=e.allDay ? '' : time24(e.time);
      $('time').disabled=!!e.allDay;
      $('name').value=e.name||'';
      $('type').value=e.type||'工作';
      $('repeat').value=e.repeat||'none';
      $('reminder').value=e.allDay ? '-1' : String(e.reminder ?? -1);
      $('reminder').disabled=!!e.allDay;
      $('note').value=e.note||'';

      $('formModal').classList.remove('hidden');
      document.body.classList.add('modal-open');
    };

    c.querySelector('.delete').onclick=()=>{

      let a=
      data.events[sel]||[];

      let idx=
      a.indexOf(e);

      if(idx>=0){
        a.splice(idx,1);
      }

      persist();

      renderAll();
    };

    box.appendChild(c);
  });

  stats();
}

function renderWeek(){

  let box=$('weekView');

  box.innerHTML='';

  let base=
  new Date(sel+'T00:00:00');

  let start=
  new Date(base);

  start.setDate(
    base.getDate()
    -
    base.getDay()
  );

  for(let i=0;i<7;i++){

    let dt=
    new Date(start);

    dt.setDate(
      start.getDate()+i
    );

    let k=
    keyFrom(
      dt.getFullYear(),
      dt.getMonth(),
      dt.getDate()
    );

    let card=
    document.createElement('div');

    card.className='event';

    let arr=
    data.events[k]||[];

    card.innerHTML=
    `<b>${label(k)}</b>`
    +
    (
      arr.length
      ?
      ''
      :
      '<div class="small" style="margin-top:5px">沒有行程</div>'
    );

    arr.forEach(e=>{

      card.innerHTML+=`
      <div style="font-size:13px;margin-top:6px">

      ${icons[e.type]}
      ${e.allDay ? '整天' : time24(e.time)}
      ${e.name}
      ${e.done?' ✓':''}

      </div>
      `;
    });

    box.appendChild(card);
  }
}

function renderGoals(){

  let box=$('goals');

  box.innerHTML='';

  data.goals.forEach((g,i)=>{

    let c=
    document.createElement('div');

    c.className='event row';

    c.innerHTML=`
    <span class="${g.done?'done':''}">
    ${g.done?'✅':'🌱'}
    ${g.text}
    </span>

    <div>
      <button class="btn gd">✓</button>
      <button class="btn gx">刪除</button>
    </div>
    `;

    c.querySelector('.gd').onclick=()=>{

      g.done=!g.done;

      persist();

      renderGoals();
    };

    c.querySelector('.gx').onclick=()=>{

      data.goals.splice(i,1);

      persist();

      renderGoals();
    };

    box.appendChild(c);
  });
}

function schedule(date,e){

  if(e.allDay || +e.reminder<0){
    return;
  }

  try{

    if(window.AndroidReminder){

      AndroidReminder.schedule(
        date,
        e.time,
        e.name,
        +e.reminder
      );
    }

  }catch(_){}
}

function renderAll(){

  renderCalendar();

  renderEvents();

  renderWeek();

  renderGoals();

  document
  .querySelectorAll('.mood')
  .forEach(b=>
    b.classList.toggle(
      'selected',
      b.textContent.trim()
      ===
      data.moods[sel]
    )
  );
}

$('prev').onclick=()=>{

  if(--view.m<0){

    view.m=11;

    view.y--;
  }

  renderCalendar();
};

$('next').onclick=()=>{

  if(++view.m>11){

    view.m=0;

    view.y++;
  }

  renderCalendar();
};

document
.querySelectorAll('.tab')
.forEach(b=>

  b.onclick=()=>{

    document
    .querySelectorAll('.tab')
    .forEach(x=>
      x.classList.remove('on')
    );

    b.classList.add('on');

    $('monthView')
    .classList.toggle(
      'hidden',
      b.dataset.tab!=='month'
    );

    $('weekView')
    .classList.toggle(
      'hidden',
      b.dataset.tab!=='week'
    );

    $('goalView')
    .classList.toggle(
      'hidden',
      b.dataset.tab!=='goal'
    );
  }
);

document
.querySelectorAll('.mood')
.forEach(b=>

  b.onclick=()=>{

    data.moods[sel]=
    b.textContent.trim();

    persist();

    renderAll();
  }
);

$('formModal').onclick=(ev)=>{
  if(ev.target===$('formModal')){
    editingEvent=null;
    editingDate=null;
    $('formModal').classList.add('hidden');
    document.body.classList.remove('modal-open');
  }
};

$('showForm').onclick=()=>{

  editingEvent=null;
  editingDate=null;

  $('formTitle').textContent='🧸 新增可愛行程';
  $('eventDate').value=sel;
  $('allDay').checked=false;
  $('time').disabled=false;
  $('reminder').disabled=false;
  $('time').value='';
  $('name').value='';
  $('type').value='工作';
  $('repeat').value='none';
  $('reminder').value='-1';
  $('note').value='';

  $('formModal').classList.remove('hidden');
  document.body.classList.add('modal-open');
};

$('allDay').onchange=()=>{
  const on=$('allDay').checked;
  $('time').disabled=on;
  $('reminder').disabled=on;
  if(on){
    $('time').value='';
    $('reminder').value='-1';
  }
};

$('cancel').onclick=()=>{

  editingEvent=null;
  editingDate=null;

  $('formModal').classList.add('hidden');
  document.body.classList.remove('modal-open');
};

$('save').onclick=()=>{

  const targetDate=$('eventDate').value||sel;

  let e={

    allDay:$('allDay').checked,

    time:$('allDay').checked ? '' : $('time').value,

    name:
    $('name').value.trim(),

    type:
    $('type').value,

    repeat:
    $('repeat').value,

    reminder:
    $('allDay').checked ? '-1' : $('reminder').value,

    note:
    $('note').value.trim(),

    done:editingEvent ? !!editingEvent.done : false
  };

  if(!targetDate||(!e.allDay&&!e.time)||!e.name){

    alert(
      e.allDay
      ?'請選擇日期並輸入行程名稱'
      :'請選擇日期、時間並輸入行程名稱'
    );

    return;
  }

  /* 非整天行程才需要 24 小時制時間 */
  if(!e.allDay){
    e.time=time24(e.time);
  }

  if(editingEvent){

    const oldDate=editingDate||sel;
    const oldArr=data.events[oldDate]||[];
    const idx=oldArr.indexOf(editingEvent);

    if(idx>=0){
      oldArr.splice(idx,1);
    }

    if(!data.events[targetDate]){
      data.events[targetDate]=[];
    }

    data.events[targetDate].push(e);
    schedule(targetDate,e);

  }else{

    if(!data.events[targetDate]){
      data.events[targetDate]=[];
    }

    data.events[targetDate].push(e);

    schedule(targetDate,e);

    if(e.repeat==='weekly'){

      let base=
      new Date(targetDate+'T00:00:00');

      for(let i=1;i<=12;i++){

        let dt=
        new Date(base);

        dt.setDate(
          base.getDate()+i*7
        );

        let k=
        keyFrom(
          dt.getFullYear(),
          dt.getMonth(),
          dt.getDate()
        );

        if(!data.events[k]){
          data.events[k]=[];
        }

        let copy={...e};

        data.events[k]
        .push(copy);

        schedule(k,copy);
      }
    }
  }

  sel=targetDate;

  const parts=targetDate.split('-').map(Number);
  if(parts.length===3){
    view.y=parts[0];
    view.m=parts[1]-1;
  }

  persist();

  editingEvent=null;
  editingDate=null;

  $('eventDate').value=sel;
  $('allDay').checked=false;
  $('time').disabled=false;
  $('reminder').disabled=false;
  $('time').value='';
  $('name').value='';
  $('type').value='工作';
  $('repeat').value='none';
  $('reminder').value='-1';
  $('note').value='';
  $('formTitle').textContent='🧸 新增可愛行程';

  $('formModal').classList.add('hidden');
  document.body.classList.remove('modal-open');

  renderAll();
};

$('addGoal').onclick=()=>{

  let v=
  $('goalInput')
  .value
  .trim();

  if(!v){
    return;
  }

  data.goals.push({
    text:v,
    done:false
  });

  $('goalInput').value='';

  persist();

  renderGoals();
};

renderAll();

</script>

  

<script>
(function(){
  const PROJECT_ID='mintcalendar-c2da5';
  const API_KEY='AIzaSyDop0xiy6O6vYSFcv4M8h2UJ4UV0TGPjQA';
  const DOC_URL='https://firestore.googleapis.com/v1/projects/'+PROJECT_ID+'/databases/(default)/documents/mintcalendar/main?key='+API_KEY;
  let timer=null;

  function encodeDocument(payload,updatedAt){
    return {fields:{payload:{stringValue:String(payload||'')},updatedAt:{stringValue:String(updatedAt||'')}}};
  }

  async function upload(payload,updatedAt){
    try{
      const r=await fetch(DOC_URL,{
        method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(encodeDocument(payload,updatedAt))
      });
      if(!r.ok) throw new Error('HTTP '+r.status);
      console.log('✅ 已同步到雲端');
    }catch(e){
      console.log('雲端同步暫時失敗，不影響 App：',e);
    }
  }

  window.cloudSync=function(payload,updatedAt){
    clearTimeout(timer);
    timer=setTimeout(function(){ upload(payload,updatedAt); },700);
  };

  async function download(){
    try{
      const r=await fetch(DOC_URL,{method:'GET',cache:'no-store'});
      if(r.status===404) return;
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j=await r.json();
      const f=j.fields||{};
      const cloudPayload=f.payload&&f.payload.stringValue;
      const cloudUpdatedAt=(f.updatedAt&&f.updatedAt.stringValue)||'';
      const localUpdatedAt=localStorage.getItem('mintCalendarUpdatedAt')||'';
      if(cloudPayload && (!localUpdatedAt || cloudUpdatedAt>localUpdatedAt)){
        if(typeof window.applyMintCalendarCloudData==='function'){
          window.applyMintCalendarCloudData(cloudPayload,cloudUpdatedAt);
        }
      }
    }catch(e){
      console.log('雲端讀取暫時失敗，不影響 App：',e);
    }
  }

  setTimeout(download,1000);
})();
</script>
